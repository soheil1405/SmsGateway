services:
  postgres:
    image: postgres:16-alpine
    container_name: arvan-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arvan
    ports:
      - "5433:5432"
    volumes:
      - arvan_pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./migrations/002_seed_user.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arvan"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: arvan-api:local
    container_name: arvan-api
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: arvan
      DB_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  arvan_pgdata:
